spring.application.name=MibbeunProject
server.servlet.context-path=/
server.port=8080
#30분 동안 세션을 유지한다는 뜻.
server.servlet.session.timeout=90m
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

#인증서 생성 밀 정보
#인증서 생성 keytool -genkeypair -alias springboot -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore keystore.p12 -validity 3650
#server.ssl.key-store=./keystore.p12
#server.ssl.key-store-password=rnd001!!
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=springboot

#최대 커넥션 수 지정
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/DATA_M
spring.datasource.username=postgres
spring.datasource.password=rnd001

mybatis.mapper-locations=mybatis/mapper/**/*.xml
#단일 파일의 최대 허용 크기
spring.servlet.multipart.max-file-size=100MB
#전체 요청(여러 파일 포함)의 최대 허용 크기
spring.servlet.multipart.max-request-size=100MB

spring.h2.console.enabled=true
#콘솔에 SQL을 보여줌
#mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# Data가 Null 인경우 
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.call-setters-on-nulls=true
mybatis.configuration.return-instance-for-empty-row=true

#SQL 쿼리 로그 출력
spring.jpa.show-sql=true
#SQL 로그 포맷팅 DEBUG

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG 
logging.level.com.example.demo.mapper=DEBUG
logging.level.org.mybatis=DEBUG
debug=true

#OFF: 모든 로깅을 비활성화합니다.
#FATAL: 애플리케이션이 심각한 오류로 인해 중단될 가능성이 있는 매우 치명적인 상황을 기록합니다.
#ERROR: 프로그램 실행 중 오류가 발생했으나, 애플리케이션이 계속 실행될 수 있는 상황을 기록합니다.
#WARN: 잠재적인 오류가 될 수 있는 경고 상황을 기록합니다. 예를 들어, deprecated된 API 사용 등이 포함됩니다.
#INFO: 애플리케이션의 주요 진행 상태를 기록합니다. (예: 서버 시작/종료, 요청 처리 시작 등)
#DEBUG: 개발 및 디버깅 목적으로, 상세한 애플리케이션 내부 동작 정보를 기록합니다.
#TRACE: 가장 상세한 레벨로, DEBUG보다 훨씬 더 자세한 정보를 기록합니다. (예: 모든 변수 값, 메서드 호출 흐름 등)
#ALL: 모든 레벨의 로그를 활성화합니다.
# 소스에서 logger.info("요청이 들어왔습니다.");
# 소스에서 logger.error("에러 발생: 테스트용 에러 로그");


#패턴 비밀번호 Error
jwt.secret:"여기에 최소 32자 이상의 랜덤 시크릿 키를 넣어주세요"
# 1시간 (밀리초 단위)
jwt.expiration-ms=3600000
